name: Release

# uses: は完全なコミット SHA に固定している (末尾のコメントが版)。Rust も具体的な版に固定する (MSRV とは別。ci.yml の rust-msrv が MSRV)。
# 更新は Dependabot (.github/dependabot.yml) が actions を、Rust の版は手で (docs/en/rust.md の Release procedure)。
# 公開: v* タグの push。タグのコミットが main にあることを確かめたうえで、Node 版の資産と Rust 版のバイナリを 1 つのリリースに載せる。
# dry-run (公開しない): workflow_dispatch または、リリースの仕組みを変える PR。同じ手順で成果物とスモークテストまで通し、
# 成果物は Actions の artifact (release-assets) に残す。dry-run の版は 0.0.0-dryrun (workflow_dispatch の version で変えられる)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'dry-run のバージョン (公開はしない)'
        required: false
        default: '0.0.0-dryrun'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'about.toml'
      - 'about.hbs'
      - 'crates/**'

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version || '0.0.0-dryrun') }}

jobs:
  # 依存のインストール・ビルド・検証は読み取り権限だけで行い、書き込み権限のトークンに触れさせない。
  pack:
    name: Build and verify Node assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail unless the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG ($GITHUB_SHA) is not on origin/main; only commits merged to main are released" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:pack -- --tag "$TAG"
      - run: node scripts/verify-release.mjs --tag "$TAG"
      # SHA256SUMS は assemble ジョブが Rust 版も含めて作り直す。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-node
          path: |
            release/*.tgz
            release/*.mjs
            release/*.LICENSES.txt
          if-no-files-found: error

  # Rust 版の依存のライセンス表記 (cargo-about)。ターゲットごとの依存差は about.toml の targets で全部含める。
  licenses:
    name: Rust third-party licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.8.4
      # 出力に載る workspace の crate の version を、リリースの version と揃える
      - run: node scripts/set-version.mjs "${TAG#v}"
      - run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Check the license file
        run: |
          for needle in tokio portable-pty windows-sys; do
            grep -q "$needle" THIRD-PARTY-LICENSES.txt || { echo "THIRD-PARTY-LICENSES.txt does not mention $needle" >&2; exit 1; }
          done
          wc -c THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: licenses-rust
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  # 5 ターゲットをすべてネイティブにビルドして (クロスコンパイルしない)、各アーカイブを展開した状態でスモークテストを実行する。
  # この matrix は scripts/release/manifest.mjs の BINARY_TARGETS と同じ内容にすること (scripts/test が一致を確かめる)。
  binary:
    name: Binary (${{ matrix.target }})
    needs: licenses
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          # VC++ 再頒布可能パッケージ (vcruntime140.dll) が無い PC でも動くよう、C ランタイムを静的リンクする。
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, rustflags: '-C target-feature=+crt-static' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: licenses-rust
          path: licenses
      - run: node scripts/set-version.mjs "${TAG#v}"
        shell: bash
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p misao --target "${{ matrix.target }}"
      - name: Pack
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/misao
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then bin+=.exe; fi
          node scripts/pack-binary.mjs --tag "$TAG" --target "${{ matrix.target }}" --bin "$bin" --licenses licenses/THIRD-PARTY-LICENSES.txt
      - name: Smoke test (serve, server.info, pane, stop)
        shell: bash
        run: node scripts/smoke-binary.mjs release/misao-*-"${{ matrix.target }}".*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: release/misao-*-${{ matrix.target }}.*
          if-no-files-found: error

  # Node 版と Rust 版の資産を 1 か所に集め、過不足がないことを確かめて、全ファイルの SHA256SUMS を作る。
  assemble:
    name: Assemble release assets
    needs: [pack, binary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - run: node scripts/finalize-release.mjs --tag "$TAG"
      - name: List the assets
        run: |
          ls -l release
          { echo '### Release assets'; echo '```'; ls -l release; echo '```'; echo '```'; cat release/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

  # 公開だけを行う。checkout も npm も使わず、トークンは gh のステップにだけ渡す。タグの push のときだけ動く (dry-run では動かない)。
  publish:
    name: Publish release assets to GitHub Releases
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release
      - name: Fail if a release for this tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; published assets are never replaced" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/* "${args[@]}"
