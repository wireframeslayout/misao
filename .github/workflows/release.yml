name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish tarballs to GitHub Releases
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fail if a release for this tag already exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; published tarballs are never replaced" >&2
            exit 1
          fi
      - run: npm ci
      - run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm run build
      - run: npm run release:pack -- --tag "$TAG"
      - run: node scripts/verify-release.mjs --tag "$TAG"
      - name: Create the release
        run: |
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/*.tgz "${args[@]}"
