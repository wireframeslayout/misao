name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  # 依存のインストール・ビルド・検証は読み取り権限だけで行い、書き込み権限のトークンに触れさせない。
  pack:
    name: Build and verify tarballs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail unless the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG ($GITHUB_SHA) is not on origin/main; only commits merged to main are released" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:pack -- --tag "$TAG"
      - run: node scripts/verify-release.mjs --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: release/*.tgz
          if-no-files-found: error

  # 公開だけを行う。checkout も npm も使わず、トークンは gh のステップにだけ渡す。
  publish:
    name: Publish tarballs to GitHub Releases
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release
      - name: Fail if a release for this tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; published tarballs are never replaced" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release/*.tgz "${args[@]}"
