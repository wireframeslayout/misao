name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck-build:
    name: Type check & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run smoke

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends vim
      - run: npm ci
      - run: npm run test:e2e

  release-pack:
    name: Release tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      - run: node scripts/set-version.mjs 0.0.0-ci
      - run: npm run build
      - run: npm run release:pack -- --tag v0.0.0-ci
      # tarball の検証に加え、バンドルのスモークテスト (scripts/smoke-bundle.mjs) もここで走る
      - run: node scripts/verify-release.mjs --tag v0.0.0-ci

  # Rust 版 (crates/)。Node 版の必須チェックとは別名にして、Rust 版が正式版になるまで必須にしない。
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-14 }
          - { name: windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  rust-msrv:
    name: Rust (MSRV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml の workspace.package.rust-version と同じ値にする
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  rust-deny:
    name: Rust (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 既存の e2e のうち Rust 版デーモンで通る範囲 (server.info、作業場所 / 窓 / ペイン、行ストリーム、イベント)。
  # 通らない範囲は docs/*/rust.md の一覧を参照。大量出力のテスト (v3) は処理速度に左右されるので release ビルドで動かす。
  rust-e2e:
    name: Rust (e2e subset)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo build --release --locked -p misao
      - run: npm run test:e2e:rust -w @misao/e2e
        env:
          MISAO_DAEMON_BIN: ${{ github.workspace }}/target/release/misao

  # 試験的 (Issue #37): Windows ネイティブで型検査と単体テストが通るか、node-pty のネイティブ導入が通るかを見る。
  # 結果は必須チェックにしない（continue-on-error）。POSIX 前提のテストが落ちるうちは赤のままで構わない。
  windows-experimental:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: node-pty native binding
        if: always()
        timeout-minutes: 2
        run: node -e "const p=require('node-pty'); const t=p.spawn('cmd.exe',['/c','echo conpty-ok'],{name:'xterm-256color',cols:80,rows:24}); let o=''; t.onData(d=>o+=d); t.onExit(()=>{console.log(o); process.exit(o.includes('conpty-ok')?0:1)})"
      - run: npm run build
        if: always()
      - run: npm run typecheck
        if: always()
      - run: npm test
        if: always()
        # 失敗の一覧を最後まで取るため、止まらないテストがあってもジョブ全体の上限より先に打ち切る
        timeout-minutes: 12
