name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck-build:
    name: Type check & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run smoke

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends vim
      - run: npm ci
      - run: npm run test:e2e

  release-pack:
    name: Release tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      - run: node scripts/set-version.mjs 0.0.0-ci
      - run: npm run build
      - run: npm run release:pack -- --tag v0.0.0-ci
      # tarball の検証に加え、バンドルのスモークテスト (scripts/smoke-bundle.mjs) もここで走る
      - run: node scripts/verify-release.mjs --tag v0.0.0-ci

  # Rust 版 (crates/)。Node 版の必須チェックとは別名にして、Rust 版が正式版になるまで必須にしない。
  # macOS は arm64 (macos-14) と x64 (macos-15-intel)、Windows は x64。
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-14 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows, os: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  rust-msrv:
    name: Rust (MSRV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml の workspace.package.rust-version と同じ値にする
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-pc-windows-gnu,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      # Windows / macOS 専用のコードも MSRV で通ること (OS ごとのジョブは stable で動く)
      - run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu
      - run: cargo check --workspace --all-targets --locked --target aarch64-apple-darwin

  rust-deny:
    name: Rust (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 既存の e2e (packages/e2e) の全部と CLI のテスト (packages/cli/test) を Rust 版のバイナリ (デーモンと CLI の両方) に向けて流す。
  # オプトイン (claude / codex / systemd) は除く。大量出力のテスト (v3) は処理速度に左右されるので release ビルドで動かす。
  # Windows は POSIX 前提のテスト (vim / bash / systemd) を分岐して skip し、CLI のテスト (packages/cli/test) は流さない
  # (Node の内部のテストと POSIX の疑似端末に頼るため。同等のものは cargo test が持つ)。
  rust-e2e:
    name: Rust e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04, bin: target/release/misao }
          # 配布する Linux のバイナリ (musl の静的リンク) でも e2e を通す
          - { name: linux-musl, os: ubuntu-24.04, bin: target/x86_64-unknown-linux-musl/release/misao, target: x86_64-unknown-linux-musl }
          - { name: macos, os: macos-14, bin: target/release/misao }
          - { name: macos-x64, os: macos-15-intel, bin: target/release/misao }
          - { name: windows, os: windows-2025, bin: target/release/misao.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends vim musl-tools
      - run: npm ci
      # npm が install スクリプトを動かさない環境で、node-pty の spawn-helper に実行権が付かない (posix_spawnp failed)。
      - if: runner.os == 'macOS'
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper
      - run: cargo build --release --locked -p misao ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: misao-${{ matrix.name }}
          path: ${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7
      - name: e2e
        shell: bash
        working-directory: packages/e2e
        env:
          MISAO_DAEMON_BIN: ${{ github.workspace }}/${{ matrix.bin }}
          MISAO_CLI_BIN: ${{ github.workspace }}/${{ matrix.bin }}
        run: node --conditions=@misao/source --import tsx --test --test-force-exit --test-concurrency=1 "test/**/*.test.ts"
      - name: CLI tests
        if: runner.os != 'Windows'
        run: npm run test:rust -w misao
        env:
          MISAO_CLI_BIN: ${{ github.workspace }}/${{ matrix.bin }}
          MISAO_DAEMON_BIN: ${{ github.workspace }}/${{ matrix.bin }}

  # launchd のテンプレート (deploy/com.misao.daemon*.plist) が壊れていないこと。展開した結果も plist として正しいこと。
  launchd-template:
    name: macOS launchd (template)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          plutil -lint deploy/com.misao.daemon.plist deploy/com.misao.daemon.binary.plist
          sed -e "s|__HOME__|$HOME|g" -e "s|__MISAO__|/usr/local/bin/misao|g" -e "s|__PATH__|/usr/bin:/bin|g" \
            deploy/com.misao.daemon.binary.plist > "$RUNNER_TEMP/rendered.plist"
          plutil -lint "$RUNNER_TEMP/rendered.plist"
          ! grep -q '__[A-Z]*__' "$RUNNER_TEMP/rendered.plist"

  # 実際に launchd のユーザーエージェントとして起動・停止できるか (launchctl bootstrap)。
  # ランナーに GUI セッションが無いと bootstrap できないので、このジョブだけ結果を必須にしない (continue-on-error)。
  launchd:
    name: macOS launchd
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p misao
      - run: bash scripts/smoke-launchd.sh "$GITHUB_WORKSPACE/target/release/misao"

  # 試験的 (Issue #37): Windows ネイティブで型検査と単体テストが通るか、node-pty のネイティブ導入が通るかを見る。
  # 結果は必須チェックにしない（continue-on-error）。POSIX 前提のテストが落ちるうちは赤のままで構わない。
  windows-experimental:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: node-pty native binding
        if: always()
        timeout-minutes: 2
        run: node -e "const p=require('node-pty'); const t=p.spawn('cmd.exe',['/c','echo conpty-ok'],{name:'xterm-256color',cols:80,rows:24}); let o=''; t.onData(d=>o+=d); t.onExit(()=>{console.log(o); process.exit(o.includes('conpty-ok')?0:1)})"
      - run: npm run build
        if: always()
      - run: npm run typecheck
        if: always()
      - run: npm test
        if: always()
        # 失敗の一覧を最後まで取るため、止まらないテストがあってもジョブ全体の上限より先に打ち切る
        timeout-minutes: 12
