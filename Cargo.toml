[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wireframeslayout/misao"
publish = false

[workspace.dependencies]
misao-protocol = { path = "crates/misao-protocol" }
misao-daemon = { path = "crates/misao-daemon" }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.30", default-features = false }
nix = { version = "0.30", default-features = false, features = ["fs", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
