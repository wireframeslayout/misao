[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wireframeslayout/misao"
publish = false

[workspace.dependencies]
misao-protocol = { path = "crates/misao-protocol" }
misao-daemon = { path = "crates/misao-daemon" }
base64 = "0.22"
jsonschema = { version = "0.30", default-features = false }
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal", "user"] }
portable-pty = "0.9"
regex = "1"
sha2 = "0.10"
rustix = { version = "1", default-features = false, features = ["std", "stdio", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "1"
vte = { version = "0.15", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", default-features = false }

[workspace.lints.rust]
# OS の API を直接呼ぶ小さなモジュール（Windows の Job Object / ACL / コンソール、macOS の waitid）だけが
# `#![allow(unsafe_code)]` を付け、安全性の根拠をコメントで示す。それ以外は unsafe を書けない。
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
