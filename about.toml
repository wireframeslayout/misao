# cargo-about の設定: 配布するバイナリに入る依存のライセンス表記 (THIRD-PARTY-LICENSES.txt) を作る。
# 許可するライセンスは deny.toml の [licenses] allow と同じにする (どちらかを変えたらもう一方も変える)。
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
# 配布するどのターゲットでも使う依存を全部含める (OS 固有の依存は cfg で外れるので、ターゲットを明示する)。
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
